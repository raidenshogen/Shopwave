spring.application.name=order-service
server.port=8084

# Database
spring.datasource.url=jdbc:postgresql://localhost:5435/orders_db
spring.datasource.username=admin
spring.datasource.password=Imiko12?
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
#JWT
application.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.jwt.access-token-expiry=900000
application.jwt.refresh-token-expiry=604800000# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ============================================
# KAFKA - MESSAGE BROKER
# ============================================

# Main Kafka Connection
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.enabled=true
# Consumer Settings
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=org.shopwave.orderservice.kafka.model.OrderEvent:org.shopwave.orderservice.kafka.model.OrderEvent

# Producer Settings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Template Default Topic
spring.kafka.template.default-topic=orders